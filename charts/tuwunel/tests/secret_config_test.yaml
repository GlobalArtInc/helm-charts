suite: secret config
templates:
  - secret-config.yaml
tests:
  - it: renders the chart's own keys under global
    release:
      name: tuwunel
    set:
      serverName: example.org
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: tuwunel-config
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\]'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'server_name = "example.org"'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'database_path = "/var/lib/tuwunel"'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'address = \["0\.0\.0\.0"\]'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'port = 8008'

  - it: has no appservice_dir without appservices
    release:
      name: tuwunel
    set:
      serverName: example.org
    asserts:
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'appservice_dir'

  - it: sets appservice_dir when appservices come from an existing Secret
    release:
      name: tuwunel
    set:
      serverName: example.org
      appservices:
        existingSecret: matrix-appservices
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'appservice_dir = "/etc/tuwunel/appservices"'

  - it: has no storage provider block when media S3 is disabled
    release:
      name: tuwunel
    set:
      serverName: example.org
    asserts:
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'storage_provider'

  - it: renders the S3 block without credentials when media S3 is enabled
    release:
      name: tuwunel
    set:
      serverName: example.org
      media:
        s3:
          enabled: true
          endpoint: https://s3.example.org
          bucket: matrix-tuwunel
          existingSecret: tuwunel-s3
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\.storage_provider\.s3\.s3\]'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'bucket = "matrix-tuwunel"'
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\s(key|secret) = '

  - it: passes a value from config through to the file
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        http:
          max_request_size: 512 MiB
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'max_request_size = "512 MiB"'

  - it: keeps the chart's own key when config tries to set it
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        server_name: other.example
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'server_name = "example.org"'
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'other\.example'

  - it: writes a whole number from config as a plain integer
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        rate_limiting:
          login:
            account:
              burst_count: 0
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'burst_count = 0\n'

  - it: keeps a fraction from config as it is
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        rate_limiting:
          login:
            account:
              burst_count: 0.5
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'burst_count = 0\.5\n'

  - it: fails on a number that Helm renders in exponent form
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        rate_limiting:
          login:
            account:
              burst_count: 1000000
    asserts:
      - failedTemplate:
          errorPattern: "rendered in exponent form"

  - it: lists the S3 provider under global.media when S3 is enabled
    release:
      name: tuwunel
    set:
      serverName: example.org
      media:
        s3:
          enabled: true
          providerName: garage
          bucket: matrix-tuwunel
          existingSecret: tuwunel-s3
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\.media\]\n\s+storage_providers = \["garage"\]\n'

  - it: has no storage_providers key when media S3 is disabled
    release:
      name: tuwunel
    set:
      serverName: example.org
    asserts:
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'storage_providers'

  - it: keeps the chart's nested key when config sets the same one
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        http:
          listen:
            port: 9000
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'port = 8008'
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'port = 9000'

  - it: renders with config set to null
    release:
      name: tuwunel
    set:
      serverName: example.org
      config: null
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'server_name = "example.org"'

  - it: renders with config set to an empty map
    release:
      name: tuwunel
    set:
      serverName: example.org
      config: {}
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'server_name = "example.org"'

  - it: appends extraConfigToml at the end of the file
    release:
      name: tuwunel
    set:
      serverName: example.org
      config:
        federation:
          enable: false
      extraConfigToml: "[global.http]\nmax_request_size = \"1 MiB\""
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\.http\]\nmax_request_size = "1 MiB"\n$'

  - it: has no backup keys and no signal_execute by default
    release:
      name: tuwunel
    set:
      serverName: example.org
    asserts:
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'backup'
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'signal_execute'

  - it: enables managed backups and the SIGUSR2 command when backup is on
    release:
      name: tuwunel
    set:
      serverName: example.org
      backup:
        enabled: true
        keep: 3
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\.database\.backup\]\n\s+keep = 3\n\s+path = "/var/lib/tuwunel/backup"'
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: '\[global\.admin\]\n\s+signal_execute = \["server backup-database"\]'

  - it: lets the chart's backup keys win over the same keys in config
    release:
      name: tuwunel
    set:
      serverName: example.org
      backup:
        enabled: true
      config:
        admin:
          signal_execute:
            - "server checkpoint-database"
        database:
          backup:
            keep: 1
            path: /elsewhere
    asserts:
      - matchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'signal_execute = \["server backup-database"\]'
      - notMatchRegex:
          path: stringData["tuwunel.toml"]
          pattern: 'checkpoint-database|/elsewhere|keep = 1\n'
