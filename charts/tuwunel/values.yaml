# Tuwunel is a Matrix homeserver written in Rust. It keeps its whole database in
# RocksDB on one volume, so the chart runs one instance and no more: a second
# process on the same database is not supported.

image:
  repository: ghcr.io/matrix-construct/tuwunel
  tag: v2.0.0
  # Production sets the digest. When set, it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# 0 or 1. Anything above 1 is refused by the schema and by validate.yaml.
replicaCount: 1

# Required. The domain in every Matrix ID on this server (@user:<serverName>).
# The server has issued IDs under it, so do not change it on an existing database.
serverName: ""

# Settings under [global] in tuwunel.toml, as a nested map.
config: {}

# Raw TOML appended to tuwunel.toml, for settings that config cannot express.
# It is glued to the end of the file, so it must start with its table header (for
# example [global.http]). Otherwise its keys land in the last table. Do not repeat a
# table that config already sets: the TOML parser rejects the duplicate.
extraConfigToml: ""

appservices:
  # Secret with appservice registration files (*.yaml), mounted as appservice_dir.
  existingSecret: ""
  # Registrations kept in values. The chart then makes its own Secret from them.
  registrations: {}

persistence:
  enabled: true
  # Use an existing claim instead of creating <fullname>-data.
  existingClaim: ""
  # Empty means the cluster default class. Do not use NFS: RocksDB needs locking and fsync.
  storageClass: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce

# Reads the SST files of the database in the background right after the container
# starts, so they land in the OS page cache. Useful with `config.rocksdb.direct_io: false`
# on network volumes.
warmCache:
  enabled: false
  # Directory with the SST files. Empty means the data directory, /var/lib/tuwunel.
  path: ""

media:
  s3:
    enabled: false
    providerName: s3
    endpoint: ""
    bucket: ""
    region: us-east-1
    basePath: ""
    useVhostRequest: false
    # Secret with the access and secret keys. They reach the pod as environment
    # variables, never through the config file.
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key

extraEnv: []
extraEnvFrom: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  # No CPU limit by default.
  limits:
    memory: 3Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 600

# Off by default. With it on, Kubernetes puts the variables of Services in the namespace
# into the pod (TUWUNEL_PORT and the like), and Tuwunel reads any TUWUNEL_* variable as config.
enableServiceLinks: false

# The server does not call the Kubernetes API, so the pod does not mount a service account token.
automountServiceAccountToken: false

probes:
  startup:
    command:
      - tuwunel
      - --health-check
    periodSeconds: 10
    failureThreshold: 180
    timeoutSeconds: 15
  liveness:
    command:
      - tuwunel
      - --health-check
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 15
  readiness:
    command:
      - tuwunel
      - --health-check
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 15

service:
  type: ClusterIP
  port: 8008

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
  extraPaths: []
  # Regular expressions for paths that answer 503 at the controller and never reach the server.
  blockedPaths: []

route:
  enabled: false
  host: ""
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
  listenerSet:
    enabled: false
    attachTo: ""
  tls:
    secretName: ""
    secretNamespace: ""
    certificate:
      enabled: false
      issuer: letsencrypt
    referenceGrant:
      enabled: false

import:
  enabled: false
  image:
    repository: ghcr.io/globalartinc/tuwunel-synapse-import
    tag: ""
    digest: ""
  synapseDb:
    existingSecret: ""
    key: uri
  signingKey:
    existingSecret: ""
    key: signing.key
  media:
    fromS3:
      enabled: false
      endpoint: ""
      bucket: ""
      prefix: ""
      # Secret with the keys access-key and secret-key for the Synapse media bucket.
      existingSecret: ""
      # Synapse could have stored media on storage that ignored the case of directory names, so the first
      # directory level of a key may differ in case from the media id. When true, every case variant of that
      # level is linked to the file after the copy.
      fixCase: true
      image:
        repository: docker.io/rclone/rclone
        tag: 1.75.2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    emptyDirSizeLimit: 5Gi
  bcryptPepper:
    existingSecret: ""
    key: pepper
  # The importer writes RocksDB to an emptyDir (the node's disk by default) and, once the import
  # has finished, copies the database to the volume. Writing to a network volume is much slower.
  # The volume stays untouched if the import fails. --import-resume does not work with it.
  scratch:
    enabled: true
    # Free space needed on the node. Counts against the container memory limit with medium: Memory.
    sizeLimit: 8Gi
    # Empty is the node's disk. Memory is also allowed.
    medium: ""
  verify: true
  extraArgs: []
  activeDeadlineSeconds: 3600
  prepare:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

# A sidecar asks the server for a managed RocksDB backup every intervalSeconds (SIGUSR2),
# then copies the backup repository to S3 with rclone. Needs persistence and one replica.
backup:
  enabled: false
  # Backup repository inside the data volume. Must be under /var/lib/tuwunel.
  path: /var/lib/tuwunel/backup
  # Backups the server keeps in the repository. At least 1.
  keep: 7
  # Pause between the end of one backup and the start of the next.
  intervalSeconds: 86400
  # Pause between the end of a failed round (or a skipped one) and the next attempt.
  retrySeconds: 900
  # The sidecar first polls the server on service.port until it answers, for at most this long.
  # If it never answers, the first round is skipped.
  startupWaitSeconds: 1800
  # Pause after the server answers, before the first backup.
  initialDelaySeconds: 600
  # How long a round waits for the new backup to appear in the repository after the signal.
  waitSeconds: 1800
  s3:
    endpoint: ""
    bucket: ""
    # The repository lands in <bucket>/<prefix>/db/.
    prefix: ""
    # Secret with the keys access-key and secret-key.
    existingSecret: ""
  image:
    repository: docker.io/rclone/rclone
    tag: 1.75.2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  # The sidecar serves tuwunel_backup_last_success_timestamp_seconds on this port at /metrics.
  metricsPort: 9101

monitoring:
  probe:
    enabled: false
    prober: ""
    module: http_2xx
  prometheusRule:
    enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podLabels: {}

fullnameOverride: ""

nameOverride: ""
