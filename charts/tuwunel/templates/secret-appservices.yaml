{{- if and .Values.appservices.registrations (not .Values.appservices.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuwunel.fullname" . }}-appservices
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $registration := .Values.appservices.registrations }}
  {{ printf "%s.yaml" $name }}: |
{{ toYaml $registration | indent 4 }}
  {{- end }}
{{- end }}
