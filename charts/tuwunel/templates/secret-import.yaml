{{- if .Values.import.enabled }}
{{- $global := dict "server_name" .Values.serverName "database_path" (ternary "/scratch/db" "/var/lib/tuwunel" .Values.import.scratch.enabled) "signing_key_path" "/etc/tuwunel-import/signing.key" "allow_federation" false }}
{{- if .Values.media.s3.enabled }}
{{- $s3 := dict "bucket" .Values.media.s3.bucket "region" .Values.media.s3.region "use_vhost_request" .Values.media.s3.useVhostRequest }}
{{- with .Values.media.s3.endpoint }}
{{- $_ := set $s3 "endpoint" . }}
{{- end }}
{{- with .Values.media.s3.basePath }}
{{- $_ := set $s3 "base_path" . }}
{{- end }}
{{- $_ := set $global "media_storage_providers" (list .Values.media.s3.providerName) }}
{{- $_ := set $global "storage_provider" (dict .Values.media.s3.providerName (dict "s3" $s3)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuwunel.importName" . }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
type: Opaque
stringData:
  import.toml: |
{{ toToml (dict "global" $global) | trimSuffix "\n" | indent 4 }}
  homeserver.yaml: |
    server_name: {{ .Values.serverName | quote }}
    signing_key_path: /etc/tuwunel-import/signing.key
    media_store_path: /synapse-media
    app_service_config_files: []
{{- end }}
