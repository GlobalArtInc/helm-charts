{{- $global := dict "server_name" .Values.serverName "database_path" "/var/lib/tuwunel" "http" (dict "listen" (dict "address" (list "0.0.0.0") "port" (int .Values.service.port))) }}
{{- if or .Values.appservices.existingSecret .Values.appservices.registrations }}
{{- $_ := set $global "appservice_dir" "/etc/tuwunel/appservices" }}
{{- end }}
{{- if .Values.media.s3.enabled }}
{{- $s3 := dict "bucket" .Values.media.s3.bucket "region" .Values.media.s3.region "use_vhost_request" .Values.media.s3.useVhostRequest }}
{{- with .Values.media.s3.endpoint }}
{{- $_ := set $s3 "endpoint" . }}
{{- end }}
{{- with .Values.media.s3.basePath }}
{{- $_ := set $s3 "base_path" . }}
{{- end }}
{{- $_ := set $global "storage_provider" (dict .Values.media.s3.providerName (dict "s3" $s3)) }}
{{- $_ := set $global "media" (dict "storage_providers" (list .Values.media.s3.providerName)) }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- $_ := set $global "database" (dict "backup" (dict "path" .Values.backup.path "keep" (int .Values.backup.keep))) }}
{{- $_ := set $global "admin" (dict "signal_execute" (list "server backup-database")) }}
{{- end }}
{{- $toml := toToml (dict "global" (merge $global (deepCopy (.Values.config | default dict)))) }}
{{- $toml = regexReplaceAll "(?m)^(\\s*[^#\\n=]+ = -?[0-9]+)\\.0$" $toml "${1}" }}
{{- if regexMatch "(?m)= -?[0-9]+(\\.[0-9]+)?e[+-][0-9]+$" $toml }}
{{- fail "A number in config was rendered in exponent form (for example 1e+06). Set the whole table through extraConfigToml, starting it with its [global...] header, and remove that table from config." }}
{{- end }}
{{- with .Values.extraConfigToml }}
{{- $toml = printf "%s\n%s" $toml . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuwunel.fullname" . }}-config
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
type: Opaque
stringData:
  tuwunel.toml: |
{{ $toml | trimSuffix "\n" | indent 4 }}
