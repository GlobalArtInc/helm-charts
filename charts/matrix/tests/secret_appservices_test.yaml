suite: secret appservices
templates:
  - secret-appservices.yaml
tests:
  - it: renders one registration file per entry
    release:
      name: tuwunel
    set:
      serverName: example.org
      appservices:
        registrations:
          bridge:
            id: bridge
            url: null
            sender_localpart: bridge
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: tuwunel-appservices
      - matchRegex:
          path: stringData["bridge.yaml"]
          pattern: 'id: bridge'

  - it: renders nothing when an existing Secret is given
    release:
      name: tuwunel
    set:
      serverName: example.org
      appservices:
        existingSecret: matrix-appservices
        registrations:
          bridge:
            id: bridge
            url: null
            sender_localpart: bridge
    asserts:
      - hasDocuments:
          count: 0
