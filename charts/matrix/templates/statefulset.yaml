{{- if eq (default "StatefulSet" .Values.workload) "StatefulSet" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tuwunel.fullname" . }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "tuwunel.fullname" . }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" . | nindent 6 }}
  template:
    {{- include "tuwunel.podTemplate" . | nindent 4 }}
{{- end }}
