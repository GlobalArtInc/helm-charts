apiVersion: v2
name: mediacore
description: WebRTC SFU speaking the LiveKit protocol, with its own front end
type: application
# The chart's own semver, not the application's. appVersion follows mediacore.
version: 0.11.0
appVersion: "0.1.0"
home: https://github.com/globalartinc/helm-charts
sources:
  - https://github.com/GlobalArtInc/mediacore
maintainers:
  - name: GlobalArt Inc
    email: support@globalart.com
keywords:
  - webrtc
  - sfu
  - livekit
  - media
# ListenerSet, used by the route this chart publishes by default, needs Gateway
# API with the ListenerSet feature; Envoy Gateway on 1.26+ is what it is tested
# against. Publishing with `ingress` instead asks nothing of the cluster that
# 1.26 does not already have.
kubeVersion: ">=1.26.0"
