{{- if .Values.sfu.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mediacore.sfu.fullname" . }}
  labels:
    {{- include "mediacore.labels" . | nindent 4 }}
    app.kubernetes.io/component: sfu
spec:
  replicas: {{ .Values.sfu.replicaCount }}
  # A StatefulSet, not a Deployment, and the volume is the reason. A meeting's
  # audio is written to disk for as long as the meeting lasts, and only the
  # process that wrote it can upload it -- the row in the queue names the node.
  # A Deployment gives every replica the same claim, which a ReadWriteOnce
  # volume cannot serve twice; here each replica gets a volume of its own that
  # follows its ordinal, so a pod that comes back finds the recordings it had
  # not finished uploading.
  #
  # The rollout keeps the property Recreate was chosen for: for one ordinal the
  # controller deletes the pod and waits for it to go before making the next,
  # so two processes never contend for the node's media port. The cost is the
  # same and still worth saying out loud -- every rollout of this workload ends
  # every meeting in progress, and the clients are told the session cannot be
  # resumed.
  serviceName: {{ include "mediacore.sfu.fullname" . }}-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mediacore.sfu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Without this a `helm upgrade` that only changes the config leaves the
        # old process running with the old settings and nothing to say so.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-sfu.yaml") . | sha256sum }}
        {{- with .Values.sfu.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mediacore.sfu.selectorLabels" . | nindent 8 }}
        {{- with .Values.sfu.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mediacore.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sfu.hostNetwork }}
      hostNetwork: true
      # Not optional with hostNetwork: on the plain ClusterFirst policy the pod
      # inherits the node's resolver and resolves nothing inside the cluster.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.sfu.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.sfu.terminationGracePeriodSeconds }}
      {{- with .Values.sfu.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The image's own binary, not a shell. It used to be `/bin/sh -c` with
        # envsubst, and that shell was the last thing keeping the published image
        # on Debian: the server renders its own config now, so all that is left
        # here is saying whether this deployment is configured -- and a binary
        # can say it.
        #
        # What it checks is what only a deployment knows. The server is right to
        # accept an empty database url (meetings go in a directory), a loopback
        # advertise address (that is what the local compose stack states) and no
        # bucket (a deployment that records nothing). Under Kubernetes each of
        # those is instead a Secret that arrived empty, and the first is the
        # worst: every meeting record would move onto a directory that may not
        # even be a volume, silently.
        #
        # It reads the same ConfigMap at the same path with the same environment
        # as the server. Anything else and the check passes on a file the server
        # then refuses, which is the one failure a check must not have.
        - name: check-config
          image: {{ include "mediacore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/mediacore"]
          args:
            - --config
            - /etc/mediacore/mediacore.yaml
            - check
            {{- if or (include "mediacore.sfu.inPostgres" .) (include "mediacore.sfu.records" .) }}
            # Recording needs the database as much as sessions.postgres does: the
            # queue that carries a finished recording to the bucket lives there.
            - --expect-postgres
            {{- end }}
            {{- if include "mediacore.sfu.records" . }}
            - --expect-recording
            {{- end }}
            {{- if .Values.sfu.advertise.fromNodeIP }}
            # Only when the address comes from the downward API. An operator who
            # states addresses by hand in sfu.advertise.addresses may well mean a
            # private one, and this is not the place to argue with them.
            - --routable-advertise
            {{- end }}
          env:
            {{- include "mediacore.sfu.configEnv" . | nindent 12 }}
          {{- with .Values.sfu.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mediacore
              readOnly: true
      containers:
        - name: sfu
          image: {{ include "mediacore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's CMD is this binary already; only the config path has to
          # be said, and it is said through the variable clap reads so that the
          # entrypoint stays whatever the image ships.
          env:
            - name: MEDIACORE_CONFIG
              value: /etc/mediacore/mediacore.yaml
            {{- include "mediacore.sfu.configEnv" . | nindent 12 }}
            {{- with .Values.sfu.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: signalling
              containerPort: {{ .Values.sfu.ports.signalling }}
              protocol: TCP
            - name: media
              containerPort: {{ .Values.sfu.ports.media }}
              protocol: UDP
              {{- if .Values.sfu.hostPort }}
              # Published on the node by the CNI. Same number on both sides,
              # always: ICE replies leave the pod from the port the socket
              # bound, and a translated port breaks the candidate the browser
              # was handed.
              hostPort: {{ .Values.sfu.ports.media }}
              {{- end }}
          {{- if .Values.sfu.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: signalling
            initialDelaySeconds: {{ .Values.sfu.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sfu.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.sfu.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sfu.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.sfu.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: signalling
            initialDelaySeconds: {{ .Values.sfu.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sfu.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.sfu.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sfu.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.sfu.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sfu.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mediacore
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: records
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.recordings.enabled }}
            - name: recordings
              mountPath: {{ .Values.recordings.mountPath }}
            {{- end }}
      volumes:
        # The ConfigMap itself, read-only, and nothing else. There used to be a
        # memory-backed scratch volume beside it for the init container to render
        # into, because the rendered file carried the token-signing secret. The
        # server fills its own variables in now, so the secret never reaches a
        # file and there is nothing to render into.
        - name: config
          configMap:
            name: {{ include "mediacore.sfu.fullname" . }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        # A claim the operator brought. One claim cannot be shared by replicas
        # of a ReadWriteOnce volume, which is why this is only sensible at one
        # replica; leave it unset and every replica gets its own.
        - name: records
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if and .Values.recordings.enabled .Values.recordings.existingClaim }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ .Values.recordings.existingClaim }}
        {{- end }}
      {{- with .Values.sfu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sfu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sfu.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # One volume per replica, named after the ordinal that owns it. These are
  # immutable once the StatefulSet exists: changing a size or a class here is
  # rejected by the API server, and the way through is to delete the
  # StatefulSet with --cascade=orphan and let it be recreated around the pods.
  volumeClaimTemplates:
    {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
    # Session records. The server refuses to start without somewhere to write
    # them, and the root filesystem is read-only on purpose, so this is not
    # optional furniture -- turning persistence off means telling the server not
    # to keep records at all. A deployment that keeps them in a database instead
    # still mounts this, unread.
    - metadata:
        name: records
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and .Values.recordings.enabled (not .Values.recordings.existingClaim) }}
    # Audio being recorded, and recordings the bucket has not taken yet. The one
    # volume whose loss loses something that cannot be recovered, and the reason
    # this workload is a StatefulSet: an upload can only be done by the process
    # that holds the file, so the volume has to come back to the same ordinal.
    - metadata:
        name: recordings
        {{- with .Values.recordings.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.recordings.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.recordings.size }}
        {{- with .Values.recordings.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
