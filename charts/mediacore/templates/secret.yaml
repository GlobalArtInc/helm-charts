{{- if not .Values.auth.existingSecret }}
{{/*
Only rendered when the chart was given both values. There is no default secret
anywhere in this chart: one would be published in a public repository, and
anybody holding it could mint a token for any room and any identity on every
deployment that took the default.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mediacore.secretName" . }}
  labels:
    {{- include "mediacore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.apiKey }}: {{ .Values.auth.apiKey | quote }}
  {{ .Values.auth.secretKeys.apiSecret }}: {{ .Values.auth.apiSecret | quote }}
{{- end }}
