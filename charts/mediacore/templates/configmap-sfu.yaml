{{- if .Values.sfu.enabled }}
{{- $config := default dict .Values.sfu.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mediacore.sfu.fullname" . }}
  labels:
    {{- include "mediacore.labels" . | nindent 4 }}
    app.kubernetes.io/component: sfu
data:
  # A template, not the file the server reads. Two of the values in it are only
  # known inside the pod -- the signing secret, which belongs in a Secret rather
  # than here, and the node's own address, which the downward API supplies at
  # start -- and mediacore does no substitution of its own, so the init
  # container renders this with envsubst into an emptyDir and points the server
  # at the result.
  #
  # Every key below is one crates/config/src/lib.rs declares. That crate is
  # written with deny_unknown_fields: one key it does not know and the process
  # exits at startup, so values.schema.json mirrors it and helm refuses a typo
  # before it becomes a crash-looping pod.
  mediacore.yaml.tmpl: |
    port: {{ .Values.sfu.ports.signalling }}
    bind_addresses:
      - 0.0.0.0
    log_level: {{ $config.log_level | default "info" | quote }}
    {{- with $config.region }}
    region: {{ . | quote }}
    {{- end }}
    # The pod's own name, which for a StatefulSet is the ordinal and survives a
    # restart. This is not decoration: an upload is offered only to the node
    # whose disk holds the file, so a replica that comes back under a new name
    # cannot claim the recordings sitting on its own volume, and they are
    # stranded for good. The server generates a fresh random id when it is not
    # told one, which is exactly the wrong behaviour here.
    node_id: {{ $config.node_id | default "${MEDIACORE_NODE_ID}" | quote }}

    # The api key is the `iss` of every token and the name the secret is looked
    # up under; the front end signs with the same pair.
    keys:
      "${MEDIACORE_API_KEY}": "${MEDIACORE_API_SECRET}"
    {{- with $config.room }}

    room:
{{ toYaml . | indent 6 }}
    {{- end }}

    rtc:
      # One UDP socket for all media, never a range: a range would have to be
      # forwarded to the pod port by port, and buys nothing that this port does
      # not already do.
      udp_port: {{ .Values.sfu.ports.media }}
      port_range_start: 0
      port_range_end: 0
      bind_address: 0.0.0.0

      # What clients are told to send media to, and the setting that decides
      # whether anybody hears anything. The socket's own address is 0.0.0.0 and
      # the pod's address is unroutable from a browser, so the address is
      # stated here and both of the server's guesses are turned off -- an
      # inferred address is how a deployment ends up signalling perfectly and
      # carrying no audio.
      advertise_addresses:
      {{- if .Values.sfu.advertise.fromNodeIP }}
        - "${MEDIACORE_ADVERTISE_IP}"
      {{- end }}
      {{- range .Values.sfu.advertise.addresses }}
        - {{ . | quote }}
      {{- end }}
      use_socket_address: false
      use_external_ip: false
      {{- with $config.rtc }}
{{ toYaml . | indent 6 }}
      {{- end }}
    {{- with $config.video }}

    video:
{{ toYaml . | indent 6 }}
    {{- end }}

    # The server refuses to start when it cannot open this, and the root
    # filesystem is read-only, so it has to be the mounted volume. Naming it
    # here rather than leaving the server's relative default is the whole
    # difference between a pod that runs and one that crash-loops with
    # "Read-only file system" -- which is exactly how this was learnt.
    {{- $sessions := $config.sessions | default dict }}
    {{- $postgres := $sessions.postgres | default dict }}
    sessions:
      directory: {{ $sessions.directory | default .Values.persistence.mountPath }}
      {{- if $postgres.enabled }}
      postgres:
        # Not in values and not in this ConfigMap: the url carries a password.
        # It comes from the Secret and is substituted at pod start, the way the
        # signing secret above is.
        url: "${MEDIACORE_POSTGRES_URL}"
        {{- with omit $postgres "enabled" "url" }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- end }}
      {{- with omit $sessions "directory" "postgres" }}
{{ toYaml . | indent 6 }}
      {{- end }}
    {{- $recording := $config.recording | default dict }}
    {{- if $recording }}

    # Recording needs sessions.postgres above -- an upload is a row several
    # processes claim -- and it needs somewhere to write while a meeting is
    # happening, which is recordings.mountPath and not the read-only root.
    # `enabled` records every meeting; without it the rooms that ask for it
    # themselves are still recorded, so the block is rendered either way.
    recording:
      directory: {{ $recording.directory | default .Values.recordings.mountPath }}
      s3:
        # From the Secret, like everything else that is a credential.
        access_key_id: "${MEDIACORE_S3_ACCESS_KEY_ID}"
        secret_access_key: "${MEDIACORE_S3_SECRET_ACCESS_KEY}"
        {{- with omit ($recording.s3 | default dict) "access_key_id" "secret_access_key" }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- with omit $recording "directory" "s3" }}
{{ toYaml . | indent 6 }}
      {{- end }}
    {{- end }}
{{- end }}
