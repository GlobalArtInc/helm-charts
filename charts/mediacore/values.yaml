# mediacore is a WebRTC SFU: signalling over HTTP and a WebSocket, and all media
# over a single UDP port that has to reach the pod without passing through a
# gateway, an HTTPRoute or any other HTTP hop.
#
# Two settings decide whether a deployment carries audio at all, and both are
# below: how UDP reaches the pod (sfu.hostNetwork / sfu.hostPort /
# sfu.mediaService), and which address the server puts into its ICE candidates
# (sfu.advertise). Everything else in this file is furniture.

# Nothing publishes a mediacore image. Build it from the Dockerfile at the root
# of github.com/GlobalArtInc/mediacore and push it somewhere this cluster can
# pull from; one image carries both binaries, and the chart picks the one each
# workload needs. There is no default repository on purpose: a plausible one
# would be somebody else's image.
image:
  repository: ""
  # Empty means the chart's appVersion. A floating tag with pullPolicy Always
  # restarts the SFU on every rollout, and every restart ends every call.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Filled in from the release name when empty.
  name: ""
  annotations: {}

# The pair that signs and verifies room tokens. The key is an identifier -- the
# `iss` of every token and the name the SFU looks the secret up under -- and the
# secret is what actually signs. The front end and the SFU must be given the
# same pair or the page loads, joining fails, and the SFU logs
# `rejecting signal connection`.
auth:
  apiKey: mediacore

  # No default, and the chart refuses to render a Secret without one:
  #
  #   openssl rand -hex 32
  #
  # At least 32 characters -- the front end refuses to start below that, so a
  # shorter one gives you an SFU that runs and a front end that crash-loops.
  # Keep it to hex or plain letters and digits: it is substituted into a YAML
  # file at pod start, and a quote or a backslash would corrupt it.
  apiSecret: ""

  # Bring your own Secret instead (sealed-secrets, external-secrets, a Secret
  # you made by hand). When set, auth.apiSecret and auth.apiKey are ignored and
  # no Secret is created by this chart.
  existingSecret: ""
  secretKeys:
    apiKey: api-key
    apiSecret: api-secret
    # Read only when the settings that need them are on: the database url when
    # sfu.config.sessions.postgres.enabled, the object store keys when
    # sfu.config.recording is set. Both are credentials, so they live in the
    # Secret and never in values -- which means they need an existingSecret, or
    # the two fields below.
    postgresUrl: postgres-url
    s3AccessKeyId: s3-access-key-id
    s3SecretAccessKey: s3-secret-access-key

  # The url of the database the SFU keeps its meetings in, with its password in
  # it: postgres://user:password@host:5432/mediacore. Only used when this chart
  # makes the Secret; with auth.existingSecret it comes from there.
  postgresUrl: ""

  # The object store's keys, on the same terms.
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

sfu:
  enabled: true

  # One. Not a default to be tuned: mediacore is a single node by construction.
  # Rooms and participants live in the memory of one process, and the two RPCs
  # that would move a participant between nodes -- ForwardParticipant and
  # MoveParticipant -- answer `unimplemented` on purpose. Two replicas behind
  # one Service put half of a room on each and neither half hears the other,
  # with nothing in any log to say why. The chart refuses to render anything
  # else. If one process is not enough, run separate releases and decide in
  # your own application which room lives where.
  replicaCount: 1

  ports:
    # Signalling and the room API: /rtc, /rtc/validate, /healthz, /twirp/... and
    # the generated /swagger page. TCP, and the only part that may go through
    # the gateway. With hostNetwork this number is also taken on the node.
    signalling: 7880
    # All media, on this one UDP port -- not a range. Whatever forwards it to
    # the pod must not renumber it unless you also state the translated port in
    # sfu.advertise.addresses.
    media: 7882

  # How media reaches the pod. Media is UDP and the pod IP is not routable from
  # a browser, so exactly one of the three mechanisms below has to carry it.
  # Which one is right depends on the CNI and on what sits in front of the
  # cluster; there is no answer that is correct everywhere.
  #
  #   hostNetwork: true (the default)
  #     The pod shares the node's network namespace and binds the media port on
  #     the node itself. Nothing renumbers the port, nothing NATs the address,
  #     and there is no extra hop -- the shortest path to working media.
  #     Costs: the pod also occupies sfu.ports.signalling on the node, so a
  #     second release scheduled onto the same node fails to bind; the pod sees
  #     every host interface, which a PodSecurity `baseline` or `restricted`
  #     namespace forbids outright; and cluster DNS only keeps working because
  #     the chart sets dnsPolicy: ClusterFirstWithHostNet with it.
  #
  #   hostPort: true, with hostNetwork: false
  #     Only the media port is published on the node; the pod keeps an ordinary
  #     pod IP and an ordinary namespace.
  #     Costs: hostPort is the CNI's job and CNIs differ. Cilium needs its
  #     host-port support enabled (it is on with kube-proxy replacement, off in
  #     some setups); portmap-based CNIs put a NAT in the media path that can
  #     rewrite the source port and silently break the candidate the browser
  #     was given. Test it with two real browsers, never with curl.
  #
  #   mediaService.enabled: true
  #     A plain UDP Service in front of the pod.
  #     Costs: a LoadBalancer needs a provider that actually forwards UDP and
  #     usually costs money; a NodePort lands on a port in the node-port range,
  #     which is a different number from sfu.ports.media, and a candidate that
  #     names the wrong port fails ICE with no error anywhere -- so with
  #     NodePort you must also set sfu.advertise.addresses to
  #     ["<node ip>:<node port>"] and turn sfu.advertise.fromNodeIP off.
  hostNetwork: true
  hostPort: false

  mediaService:
    enabled: false
    type: LoadBalancer
    # Fixed node port; with type NodePort this is the number clients must be
    # told about (see sfu.advertise.addresses above).
    nodePort: null
    loadBalancerIP: ""
    # Local keeps the client's address and avoids a second hop between nodes,
    # both of which matter for media. Cluster spreads UDP over nodes that are
    # not running the SFU, which is one more translation in the media path.
    externalTrafficPolicy: Local
    annotations: {}

  # THE ONE THAT BREAKS AUDIO. What is listed here is written verbatim into the
  # server's ICE candidates, and it is where every browser sends its microphone.
  # Get it wrong and nothing looks broken: people join, the participant list is
  # right, the mute button works, and the room is silent. No error is logged,
  # because packets addressed to an unreachable address look exactly like
  # packets a firewall ate. You find it by reading the SFU's own line --
  # `media transport ready ... advertise=[...]` -- and asking whether a browser
  # out there can send a UDP packet to that address and port.
  advertise:
    # The node's address, read at pod start from the downward API
    # (status.hostIP) and substituted into the config. Correct for hostNetwork
    # and for hostPort; wrong as soon as media arrives through something that
    # changes the address or the port -- a LoadBalancer, a NodePort, NAT in
    # front of the cluster -- and then you turn this off and state the address.
    fromNodeIP: true

    # Extra addresses, each becoming one more candidate for clients to try.
    # "203.0.113.7" keeps sfu.ports.media; "203.0.113.7:31882" states a
    # different port, which is what a NodePort or a port-translating NAT needs.
    # Addresses only, never names: ICE candidates carry addresses and the
    # server rejects a hostname at startup.
    #
    # Both may be on at once -- the node's address for clients inside the
    # network and a public one for everybody else.
    addresses: []

  # The rest of the server's own config file, in the server's own key names, so
  # that config-sample.yaml in the mediacore repository reads as documentation
  # for this block. It is rendered into a ConfigMap and mounted.
  #
  # The server rejects any key it does not know and exits, so a typo here would
  # be a pod that crash-loops with the reason buried in its logs -- values.
  # schema.json mirrors crates/config/src/lib.rs and turns that into a refusal
  # from `helm install` naming the key instead.
  #
  # Missing on purpose, because the chart owns them and would overwrite
  # anything you put here: keys (auth above), port and bind_addresses
  # (sfu.ports.signalling), rtc.udp_port (sfu.ports.media), rtc.bind_address,
  # rtc.advertise_addresses, rtc.node_ip, rtc.use_socket_address and
  # rtc.use_external_ip (sfu.advertise), rtc.port_range_start and
  # rtc.port_range_end (mediacore uses one port, not a range).
  config:
    log_level: info

    room:
      # off means a room has to be created through the room API before anybody
      # can join it, which is how you keep the SFU to rooms your application
      # knows about. With it on, walking in creates the room and walking out
      # ends it.
      auto_create: true
      # How long a created room is kept with nobody in it: empty_timeout before
      # anybody has ever joined, departure_timeout after the last one leaves.
      # 0 for either means such a room is never collected and only DeleteRoom
      # is rid of it -- in a process that never restarts, the room list then
      # grows forever.
      empty_timeout: 300
      departure_timeout: 20
      max_participants: 0
      # The room ends when fewer than min_humans people remain, end_grace
      # seconds later; 0 turns the policy off, which is what every room does
      # today.
      min_humans: 0
      end_grace: 90
      # What happens when an identity already in the room joins again: `suffix`
      # lets one person be in from a laptop and a phone at once, `displace`
      # throws the earlier session out, the way LiveKit does.
      duplicate_identity: suffix
      sweep_interval_ms: 1000

    rtc:
      # How long a media transport may sit disconnected before the participant
      # is dropped, and how long an unanswered offer is held. Both in seconds.
      ice_disconnected_timeout: 20
      negotiation_timeout: 15

    # Where the record of every meeting is kept. A directory -- persistence
    # below -- is one process; a database is what more than one process, or any
    # recording at all, needs. The url itself is never here: it carries a
    # password, so it comes from the Secret (auth.postgresUrl) and is
    # substituted into the config at pod start. Everything else postgres takes
    # -- connections, timeout_ms, attempts, lease_ms -- can be set beside
    # `enabled` and is passed through.
    sessions:
      postgres:
        enabled: false

    # Recording. Absent -- as it is here -- and the server records nothing and
    # needs no bucket. Present, and it needs sessions.postgres above, the
    # recordings volume, and an object store to put finished audio in; the
    # chart refuses to render without the first two.
    #
    #   recording:
    #     # true records every meeting. false still records the rooms that ask
    #     # for it themselves, with {"sessionPolicy": {"record": true}} in the
    #     # metadata they were created with.
    #     enabled: false
    #     s3:
    #       endpoint: https://storage.example.com
    #       region: us-east-1
    #       bucket: mediacore
    #       path_style: true
    #       prefix: ""
    #
    # The keys are not settings and are not written here: they come from the
    # Secret, as auth.s3AccessKeyId and auth.s3SecretAccessKey.

    video:
      dynacast_pause_delay_ms: 5000
      layer_upgrade_hold_ms: 2000
      # Bandwidth estimation, allocation and pacing. Off until it has been
      # benched against a constrained link on this deployment; turning it on
      # gives every subscriber a congestion estimator and a pacer, and hands
      # the server a budget to spend across that subscriber's video tracks.
      # config-sample.yaml in the mediacore repository documents the rest.
      bwe:
        enabled: false

    # Data channels, and the chat that stands on them. On in the server by
    # default, so the block is only worth writing to turn it off or to move the
    # limits: a client opens its channels the moment it connects, and a server
    # that takes them and forwards nothing loses messages with nothing in any
    # log to say so.
    #
    # data:
    #   enabled: true
    #   max_packet_bytes: 64000
    #   rate: 60
    #   burst: 120

    # Who is told what happens as it happens. Nothing is started until a
    # destination is named -- with no webhook url and no broker there is no
    # outbox, no task and no cost -- so an absent block is a deployment that
    # announces nothing and pays nothing for it.
    #
    # `directory` is the outbox: what has been promised and not yet taken. It
    # defaults to an `events` folder on the sessions volume, because the pod's
    # root filesystem is read-only and an outbox on an emptyDir loses what it
    # was holding every time the pod moves.
    #
    # The Kafka producer is behind a Cargo feature. The image this chart
    # installs carries it, so naming a broker is enough; a broker named against
    # a build without it is refused at startup rather than quietly ignored.
    #
    # events:
    #   webhooks:
    #     urls:
    #       - https://backoffice.example.com/mediacore/webhook
    #   kafka:
    #     brokers: kafka-bootstrap.kafka:9092
    #     topic: mediacore

  service:
    type: ClusterIP
    annotations: {}

  # A restart of this workload ends every call in progress -- there is no state
  # anywhere but this process's memory, and the server tells a client that
  # reconnects that its session cannot be resumed. A liveness probe is
  # therefore a loaded gun: a slow node or a paused process for longer than
  # failureThreshold * periodSeconds hangs up on everyone. It is on because a
  # wedged SFU is worse, but the numbers are deliberately slack, and turning it
  # off is a legitimate choice for a small deployment.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  resources: {}
  # resources:
  #   requests:
  #     cpu: "1"
  #     memory: 512Mi
  #   limits:
  #     memory: 2Gi
  # A CPU limit on an SFU is a decision to drop audio under load rather than to
  # be slow: throttling shows up as choppy sound for everybody in the room.

  # uid 10001 is the `mediacore` user the image creates. It is stated as a
  # number because the image's USER is a name, and the kubelet cannot verify a
  # named user against runAsNonRoot -- with runAsNonRoot alone the pod is
  # refused with "image has non-numeric user (mediacore), cannot verify".
  podSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # The rendered config goes to an emptyDir and the binary writes nothing
    # else, so the image's filesystem can stay read-only.
    readOnlyRootFilesystem: true

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Long enough for a meeting to be told the server is going away; there is no
  # draining to wait for, because there is nowhere for a session to drain to.
  terminationGracePeriodSeconds: 30
  extraEnv: []

front:
  # The page and the token endpoint. Turn it off to run the SFU behind a front
  # end of your own; nothing else in the chart depends on it, because the front
  # end never talks to the SFU -- it signs tokens the SFU verifies later, and
  # the browser is what connects the two.
  enabled: true
  # Stateless, so scale it freely. The limit on the SFU does not apply here.
  replicaCount: 2
  port: 8080

  # What the browser is told to open for signalling. Scheme and bare host only:
  # no path, no trailing slash. The front end appends /rtc itself and refuses
  # to start otherwise, naming the variable. Empty means wss://<route.host>,
  # which is the arrangement the route below builds: the page and the WebSocket
  # on one origin, so the certificate the visitor already accepted covers both.
  wsUrl: ""

  # The room the bare URL offers and the namespace every other room hangs off:
  # /r/standup puts a visitor in <room>.standup. The token endpoint is
  # unauthenticated, so it is confined to this room and its namespace and
  # cannot mint a token for anything else on the same SFU.
  room: demo

  service:
    type: ClusterIP
    annotations: {}

  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  resources: {}

  podSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 30
  extraEnv: []

# Publishing, in the house shape: a ListenerSet on the shared gateway plus an
# HTTPRoute, the same pattern as the `route` chart in this repository. This is
# the default because the cluster this chart comes from runs Gateway API behind
# Envoy Gateway; `ingress` below is the same publishing for a cluster that does
# not, and the two are alternatives, not layers.
#
# The page and signalling must be on ONE origin. The front end may only be
# handed a bare host, and a page served over https may only open wss to a name
# the browser already trusts; splitting them across two hostnames means the
# WebSocket is refused with nothing shown to the user and nothing logged on the
# server. That is why the rules below put /rtc and /twirp on the SFU and
# everything else on the front end, under the same hostname.
route:
  enabled: true

  # Required when enabled. The name visitors type -- no scheme, no path.
  host: ""

  gateway:
    name: moscow-gateway
    namespace: envoy-gateway-system

  tls:
    # An existing certificate Secret in this namespace. Wildcards are already
    # issued for the cluster's domains, so this is normally the wildcard's
    # Secret and nothing new is requested.
    secretName: ""

    # The namespace that Secret lives in, when it is not this release's own.
    # A cluster wildcard usually lives once, beside cert-manager, and every
    # listener points at it -- and a certificateRef without a namespace is
    # resolved in the listener's namespace, so leaving this empty against a
    # shared certificate gives you a listener that is Accepted and never
    # Programmed, with `Secret <your namespace>/<name> does not exist` buried in
    # its status and nothing at all on port 443.
    #
    # Cross-namespace reads need a ReferenceGrant in the *secret's* namespace
    # permitting Gateways from the gateway's namespace to read it. That grant is
    # not this chart's to make -- it lives with the certificate, is shared by
    # every listener that points there, and creating it from here would mean
    # each release claiming authority over a namespace it does not own.
    secretNamespace: ""

    # Only for a host no wildcard covers. Off by default: a second Certificate
    # for a name that is already certified is a cert-manager order that can
    # fail, rate-limit, or quietly replace a working Secret.
    certificate:
      enabled: false
      issuer: letsencrypt

    # The gateway lives in another namespace and may not read a Secret in this
    # one without a grant. Turn it off if your cluster grants the wildcard
    # Secret to the gateway some other way, or the duplicate is harmless but
    # noisy.
    referenceGrant:
      enabled: true
      name: ""

  # The generated API page at /swagger, served by the SFU. It carries no token
  # and leaks nothing, but its Try-it-out buttons act on the real room service
  # -- DeleteRoom really does hang up on everyone -- so it is off the public
  # origin by default and reachable with
  # `kubectl port-forward svc/<release>-mediacore-sfu 7880:7880`.
  # Note that with this off, /swagger falls through to the front end and
  # answers 404, which reads exactly like a broken build.
  #
  # It lives here rather than under both publishers because there is one path
  # split and it is written once: this switch governs the Ingress below as well,
  # route.enabled or not.
  swagger: false

  annotations: {}

# The same publishing, as one Ingress, for a cluster that has no Gateway API.
# One hostname, and the same split as the route above -- /rtc and /twirp (plus
# /swagger when route.swagger is on) to the SFU, everything else to the front
# end -- because both objects read that split from one place in the chart and
# cannot drift apart.
#
# IT DOES NOT CARRY MEDIA, and no ingress controller can. Media is UDP on
# sfu.ports.media addressed to the node, and this object is HTTP: turning it on
# changes nothing about sfu.hostNetwork, sfu.hostPort or sfu.advertise. Whoever
# expects an Ingress to end the business with the node's address gets a room
# where everybody connects, the participant list is right, and nobody hears
# anything.
#
# Both this and route.enabled on the same name is allowed: it is how you move a
# live deployment from the gateway to an ingress controller -- both publish the
# name, you move the DNS record, then you turn the old one off. Two *different*
# names fails the render, because the front end is built with one WebSocket URL
# and the other name would serve a page that cannot connect.
ingress:
  enabled: false

  # Empty means whichever IngressClass the cluster marks as default. If there is
  # no default, the object is created, no controller ever looks at it, and the
  # only sign is an Ingress with no ADDRESS in `kubectl get ingress` while the
  # hostname answers from wherever DNS points instead.
  className: ""

  # The name visitors type -- no scheme, no path. Empty means route.host, which
  # is where the name lives even with route.enabled: false; one origin, written
  # once, because the page and the signalling WebSocket must share it.
  host: ""

  # ingress-nginx closes an upstream connection that has been quiet for 60
  # seconds (proxy-read-timeout and proxy-send-timeout, both default 60), and a
  # signalling WebSocket carries nothing at all while a call is simply going on.
  # So everybody is dropped about a minute in, together, with nothing in the
  # SFU's log -- from its side the proxy closed the connection, which is not an
  # error. These two are here so that the default install does not do that.
  # They are an idle timeout, not a limit on how long a call may last: any
  # signalling traffic resets it.
  #
  # THEY ARE ingress-nginx ANNOTATIONS AND NOTHING ELSE READS THEM. On another
  # controller they are inert -- not an error, just ignored -- and you have to
  # set that controller's own equivalent or you get the same drop at whatever
  # its own idle timeout is:
  #
  #   Traefik      the timeouts are on the entrypoint (respondingTimeouts),
  #                not on an annotation
  #   AWS ALB      alb.ingress.kubernetes.io/load-balancer-attributes:
  #                idle_timeout.timeout_seconds=3600; the ALB default is 60
  #   GKE / GCE    a BackendConfig with timeoutSec, referenced from the Service;
  #                the default is 30
  #   HAProxy      a tunnel timeout of its own, spelled differently by each of
  #                the two HAProxy ingress controllers
  #
  # Whichever it is, prove it with a call that sits quiet for two minutes.
  # Joining, talking and leaving never reproduces this.
  #
  # These are chart defaults and what you set here merges with them; to drop one
  # rather than change it, set it to null.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

  tls:
    # An existing certificate Secret, in THIS namespace: an Ingress reads no
    # Secret from anywhere else, so unlike the route above a shared wildcard has
    # to be copied here (reflector, external-secrets, or by hand) and there is
    # nothing for the chart to grant.
    #
    # Empty renders no tls block and the controller serves the name over plain
    # http, which is worth understanding before choosing it: browsers hand out a
    # microphone on a secure origin only, localhost excepted, so the page loads
    # and the Join button gets a permission error. front.wsUrl is derived as
    # wss:// regardless, because TLS is often terminated in front of the
    # cluster; if nothing terminates it, state front.wsUrl by hand.
    secretName: ""

# Persistence: deliberately absent. mediacore writes nothing to disk today --
# rooms, participants and every counter live in the process's memory, which is
# also why a restart ends every call. Session records and call recordings are
# being designed and will need a volume; when they land, it belongs here, and
# an empty PVC before then would store nothing while making the SFU harder to
# schedule.
#
# Where the SFU keeps its session records: one self-describing JSON file per
# meeting, which is what makes `find … -mtime +90 -delete` a retention policy
# rather than a database nobody may touch.
#
# This is not optional furniture. The root filesystem is read-only on purpose,
# and the server refuses to start when it cannot open the directory -- so
# turning this off means also telling the server to keep no records, by pointing
# sfu.config.sessions.directory at somewhere writable or by removing the block.
# A pod that starts and quietly writes its history to a filesystem that vanishes
# with it would be worse than the refusal.
persistence:
  enabled: true

  # Bring your own claim instead; storageClass, accessModes and size are then
  # unused and no PVC is created.
  existingClaim: ""

  # Empty takes the cluster's default class, which on a bare-metal cluster is
  # often local-path -- a volume with no node affinity, whose contents are gone
  # the first time the pod is rescheduled. Name a real class.
  storageClass: ""

  accessModes:
    - ReadWriteOnce

  # Records are small: a six-person meeting is about a kilobyte. This is sized
  # for years of them plus room for whatever retention lag you actually run.
  size: 10Gi

  # Must agree with sfu.config.sessions.directory, and the image already creates
  # this path owned by the uid the pod runs as.
  mountPath: /var/lib/mediacore/sessions

  annotations: {}

# The volume audio is recorded to. Separate from the one above because it is a
# different size and a different risk: session records are kilobytes and can be
# rebuilt from nothing worse than a gap in a list, while this holds the audio of
# meetings that are happening right now and recordings the bucket has not taken
# yet. Turn it on with sfu.config.recording.
recordings:
  enabled: false

  existingClaim: ""

  # Empty takes the cluster's default class. Name a real one: local-path gives
  # a volume with no node affinity, and the first reschedule takes every
  # recording that had not been uploaded with it.
  storageClass: ""

  accessModes:
    - ReadWriteOnce

  # An hour of one person's speech is about 30 MB of Opus. This is a day of a
  # busy server plus room for a bucket that is unreachable over a weekend.
  size: 50Gi

  # Must agree with sfu.config.recording.directory, and the image creates this
  # path owned by the uid the pod runs as.
  mountPath: /var/lib/mediacore/recordings

  annotations: {}
