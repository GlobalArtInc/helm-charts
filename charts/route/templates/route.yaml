{{- $secret := include "route.secret" . }}
{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secret }}
spec:
  secretName: {{ $secret }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.issuer }}
  commonName: {{ .Values.host }}
  dnsNames:
  - {{ .Values.host }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ default (printf "envoy-gateway-read-%s" $secret) .Values.certificate.grantName }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: {{ .Values.gateway.namespace }}
  to:
  - group: ''
    kind: Secret
    name: {{ $secret }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "route.name" . }}-listeners
spec:
  parentRef:
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  listeners:
  - name: https
    protocol: HTTPS
    hostname: {{ .Values.host }}
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ $secret }}
    allowedRoutes:
      namespaces:
        from: Same
{{- if .Values.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "route.name" . }}-route
spec:
  parentRefs:
{{- if .Values.route.viaGatewayHttp }}
  - name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: http
{{- end }}
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: {{ include "route.name" . }}-listeners
    sectionName: https
  hostnames:
  - {{ .Values.host }}
  rules:
{{- if .Values.route.rules }}
{{ toYaml .Values.route.rules | indent 2 }}
{{- else }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
{{ toYaml .Values.route.backends | indent 4 }}
{{- end }}
{{- end }}
