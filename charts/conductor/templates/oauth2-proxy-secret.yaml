{{- if and .Values.oauth2Proxy.enabled (not .Values.oauth2Proxy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor.oauth2Proxy.secretName" . }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.oauth2Proxy.oidc.clientId | quote }}
  client-secret: {{ .Values.oauth2Proxy.clientSecret | quote }}
  cookie-secret: {{ .Values.oauth2Proxy.cookieSecret | quote }}
{{- end -}}
