{{- if and (not .Values.postgres.existingSecret) .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor.postgres.secretName" . }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
{{- end }}
{{- if and .Values.elasticsearch.enabled (not .Values.elasticsearch.existingSecret) .Values.elasticsearch.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor.elasticsearch.secretName" . }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.elasticsearch.password | quote }}
{{- end }}
