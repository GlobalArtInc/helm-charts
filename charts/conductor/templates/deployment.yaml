apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conductor.fullname" . }}
  labels:
    {{- include "conductor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "conductor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ print (include (print $.Template.BasePath "/secret.yaml") .) (include (print $.Template.BasePath "/oauth2-proxy-secret.yaml") .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "conductor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: conductor
          image: {{ include "conductor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONFIG_PROP
              value: config.properties
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.postgres.secretName" . }}
                  key: {{ include "conductor.postgres.secretKey" . }}
            {{- if include "conductor.elasticsearch.hasPassword" . }}
            - name: CONDUCTOR_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.elasticsearch.secretName" . }}
                  key: {{ include "conductor.elasticsearch.secretKey" . }}
            {{- end }}
            {{- with .Values.javaOpts }}
            - name: JAVA_OPTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
        {{- if .Values.oauth2Proxy.enabled }}
        {{- $proxy := .Values.oauth2Proxy }}
        {{- $host := include "conductor.oauth2Proxy.host" . }}
        - name: oauth2-proxy
          image: {{ printf "%s:%s" $proxy.image.repository $proxy.image.tag | quote }}
          imagePullPolicy: {{ $proxy.image.pullPolicy }}
          securityContext:
            {{- if $proxy.securityContext }}
            {{- toYaml $proxy.securityContext | nindent 12 }}
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- end }}
          args:
            - --provider=oidc
            - {{ printf "--oidc-issuer-url=%s" $proxy.oidc.issuerUrl | quote }}
            - {{ printf "--redirect-url=%s" (include "conductor.oauth2Proxy.redirectUrl" .) | quote }}
            - --upstream=http://127.0.0.1:8080/
            - {{ printf "--http-address=0.0.0.0:%d" (int $proxy.port) | quote }}
            {{- range $proxy.emailDomains }}
            - {{ printf "--email-domain=%s" . | quote }}
            {{- end }}
            - --cookie-secure=true
            - --cookie-samesite=lax
            - {{ printf "--cookie-expire=%s" $proxy.cookieExpire | quote }}
            {{- with $proxy.cookieRefresh }}
            - {{ printf "--cookie-refresh=%s" . | quote }}
            {{- end }}
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --reverse-proxy=true
            - {{ printf "--whitelist-domain=%s" $host | quote }}
            {{- range $proxy.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: auth
              containerPort: {{ $proxy.port }}
              protocol: TCP
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              {{- if $proxy.existingSecret }}
              value: {{ $proxy.oidc.clientId | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.oauth2Proxy.secretName" . }}
                  key: client-id
              {{- end }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.oauth2Proxy.secretName" . }}
                  key: {{ include "conductor.oauth2Proxy.clientSecretKey" . }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor.oauth2Proxy.secretName" . }}
                  key: {{ include "conductor.oauth2Proxy.cookieSecretKey" . }}
            {{- with $proxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $proxy.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /ping
              port: auth
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: auth
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- if $proxy.resources }}
            {{- toYaml $proxy.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
            {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "conductor.fullname" . }}
        {{- if .Values.oauth2Proxy.enabled }}
        {{- with .Values.oauth2Proxy.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
