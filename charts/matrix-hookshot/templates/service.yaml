apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix-hookshot.fullname" . }}
  labels:
    {{- include "matrix-hookshot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "matrix-hookshot.selectorLabels" . | nindent 4 }}
  ports:
    - name: appservice
      port: 9993
      targetPort: appservice
      protocol: TCP
    - name: webhooks
      port: 9000
      targetPort: webhooks
      protocol: TCP
    {{- if .Values.widgets.enabled }}
    - name: widgets
      port: {{ .Values.widgets.port }}
      targetPort: widgets
      protocol: TCP
    {{- end }}
