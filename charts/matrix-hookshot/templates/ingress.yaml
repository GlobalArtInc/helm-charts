{{- include "matrix-hookshot.validate" . -}}
{{- if .Values.ingress.enabled }}
{{- $host := include "matrix-hookshot.ingress.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "matrix-hookshot.fullname" . }}
  labels:
    {{- include "matrix-hookshot.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (default dict .Values.ingress.annotations) }}
  {{- if .Values.extraPaths }}
  {{- $rewrites := list }}
  {{- range .Values.extraPaths }}
  {{- $rewrites = append $rewrites (printf "rewrite ^%s(/.*)?$ %s$1 break;" . $.Values.path) }}
  {{- end }}
  {{- $snippet := get $annotations "nginx.ingress.kubernetes.io/configuration-snippet" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/configuration-snippet" (join "\n" (compact (concat (list $snippet) $rewrites))) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix-hookshot.fullname" . }}
                port:
                  number: 9000
          {{- range .Values.extraPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix-hookshot.fullname" $ }}
                port:
                  number: 9000
          {{- end }}
{{- end }}
