apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matrix-hookshot.fullname" . }}
  labels:
    {{- include "matrix-hookshot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "matrix-hookshot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matrix-hookshot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: hookshot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: appservice
              containerPort: 9993
              protocol: TCP
            - name: webhooks
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: appservice
          livenessProbe:
            tcpSocket:
              port: appservice
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          projected:
            sources:
              - secret:
                  name: {{ include "matrix-hookshot.fullname" . }}
              - secret:
                  name: {{ required "registration.secretName is required" .Values.registration.secretName }}
                  items:
                    - key: {{ required "registration.key is required" .Values.registration.key }}
                      path: registration.yml
        - name: tmp
          emptyDir: {}
