apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrix-hookshot.fullname" . }}
  labels:
    {{- include "matrix-hookshot.labels" . | nindent 4 }}
stringData:
  config.yml: |
    {{- toYaml .Values.config | nindent 4 }}
  passkey.pem: |
    {{- required "passkey is required" .Values.passkey | nindent 4 }}
