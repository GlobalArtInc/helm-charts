image:
  repository: ghcr.io/matrix-org/matrix-hookshot
  tag: 7.5.0
  pullPolicy: IfNotPresent

config: {}

passkey: ""

path: /webhook

registration:
  secretName: ""
  key: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

route:
  enabled: false
  host: ""
  gateway:
    name: moscow-gateway
    namespace: envoy-gateway-system
    sectionName: ""
  listenerSet:
    enabled: false
    attachTo: ""
  tls:
    secretName: ""
    secretNamespace: ""
    certificate:
      enabled: false
      issuer: letsencrypt
    referenceGrant:
      enabled: true
      name: ""
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    secretName: ""
