image:
  repository: ghcr.io/matrix-org/matrix-hookshot
  tag: 7.5.0
  pullPolicy: IfNotPresent

config: {}

passkey: ""

registration:
  secretName: ""
  key: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  className: nginx
  host: ""
  path: /webhook
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
