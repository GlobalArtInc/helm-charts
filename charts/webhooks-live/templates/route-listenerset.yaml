{{- if and .Values.route.enabled .Values.route.listenerSet.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "webhooks-live.fullname" . }}-listeners
  labels:
    {{- include "webhooks-live.labels" . | nindent 4 }}
spec:
  parentRef:
    name: {{ .Values.route.gateway.name }}
    namespace: {{ .Values.route.gateway.namespace }}
  listeners:
    - name: https
      protocol: HTTPS
      hostname: {{ .Values.route.host }}
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "webhooks-live.route.tlsSecretName" . }}
            {{- with .Values.route.tls.secretNamespace }}
            namespace: {{ . }}
            {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
