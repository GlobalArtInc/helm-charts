{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webhooks-live.fullname" . }}-egress
  labels:
    {{- include "webhooks-live.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webhooks-live.instanceSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - to:
        {{- toYaml .Values.networkPolicy.egress.dns.to | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.database.to }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.networkPolicy.egress.database.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
