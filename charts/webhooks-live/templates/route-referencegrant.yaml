{{- if and .Values.route.enabled .Values.route.listenerSet.enabled .Values.route.tls.referenceGrant.enabled (not .Values.route.tls.secretNamespace) }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ default (printf "%s-tls-read" (include "webhooks-live.fullname" .)) .Values.route.tls.referenceGrant.name }}
  labels:
    {{- include "webhooks-live.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.route.gateway.namespace }}
  to:
    - group: ""
      kind: Secret
      name: {{ include "webhooks-live.route.tlsSecretName" . }}
{{- end }}
