apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhooks-live.fullname" . }}-admin
  labels:
    {{- include "webhooks-live.admin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: 9090
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "webhooks-live.selectorLabels" . | nindent 4 }}
