apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhooks-live.fullname" . }}
  labels:
    {{- include "webhooks-live.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "webhooks-live.selectorLabels" . | nindent 4 }}
