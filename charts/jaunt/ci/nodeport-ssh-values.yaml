publicUrl: https://jaunt.example.org
sshSuffix: ssh.example.org
agentEndpoint: agents.example.org:443
gateEndpoint: gate.example.org:22

image:
  repository: registry.example.org/jaunt

oidc:
  issuerUrl: https://sso.example.org
  clientId: jaunt
  clientSecret:
    name: jaunt-oidc
    key: client-secret

ca:
  identitySecret:
    name: jaunt-ca-identity
    key: identity

sshGate:
  enabled: true
  proxyProtocol: true
  trustedProxies:
    - 192.0.2.10/32

service:
  ssh:
    type: NodePort
    port: 2222
    nodePort: 30022
    externalTrafficPolicy: Local
    annotations:
      example.org/owner: platform

route:
  gateway:
    name: example-gateway
    namespace: envoy-gateway-system
  tls:
    secretName: wildcard-example-org
    secretNamespace: example-certs
  http:
    enabled: true
  agents:
    enabled: true
    apiVersion: gateway.networking.k8s.io/v1

networkPolicy:
  enabled: true
  ingress:
    http:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    agents:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    ssh:
      from:
        - ipBlock:
            cidr: 192.0.2.10/32
