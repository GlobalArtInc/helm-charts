{{- if .Values.route.http.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jaunt.fullname" . }}-route
  labels:
    {{- include "jaunt.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "jaunt.parentRef" (dict "ctx" . "listener" "https" "sectionName" .Values.route.http.sectionName) | nindent 4 }}
  hostnames:
    - {{ include "jaunt.route.httpHost" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "jaunt.fullname" . }}
          port: {{ .Values.service.ports.http.port }}
      {{- with .Values.route.http.timeouts.request }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
{{- if .Values.route.http.redirect.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jaunt.fullname" . }}-redirect
  labels:
    {{- include "jaunt.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "jaunt.parentRef" (dict "ctx" . "listener" "http" "sectionName" .Values.route.http.redirect.sectionName) | nindent 4 }}
  hostnames:
    - {{ include "jaunt.route.httpHost" . | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: {{ .Values.route.http.redirect.statusCode }}
            {{- with .Values.route.http.redirect.port }}
            port: {{ . }}
            {{- end }}
{{- end }}
{{- end }}
