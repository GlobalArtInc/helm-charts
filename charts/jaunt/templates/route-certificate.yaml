{{- if and .Values.route.http.enabled .Values.route.listenerSet.enabled .Values.route.tls.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "jaunt.route.tlsSecretName" . }}
  labels:
    {{- include "jaunt.labels" . | nindent 4 }}
spec:
  secretName: {{ include "jaunt.route.tlsSecretName" . }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.route.tls.certificate.issuer }}
  commonName: {{ include "jaunt.route.httpHost" . }}
  dnsNames:
    - {{ include "jaunt.route.httpHost" . }}
{{- end }}
