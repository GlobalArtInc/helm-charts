{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jaunt.claimName" . }}
  labels:
    {{- include "jaunt.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.persistence.annotations }}
  {{- if .Values.persistence.retain }}
  {{- $annotations = mergeOverwrite $annotations (dict "helm.sh/resource-policy" "keep") }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
