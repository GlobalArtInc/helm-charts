{{- include "synapse-admin.validate" . -}}
{{- if .Values.ingress.enabled }}
{{- $host := include "synapse-admin.ingress.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "synapse-admin.fullname" . }}
  labels:
    {{- include "synapse-admin.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "synapse-admin.fullname" . }}
                port:
                  number: 8080
          {{- if .Values.adminApi.enabled }}
          - path: {{ .Values.adminApi.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.adminApi.service.name }}
                port:
                  number: {{ .Values.adminApi.service.port }}
          {{- end }}
{{- end }}
