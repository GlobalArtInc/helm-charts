image:
  repository: ghcr.io/etkecc/ketesa
  tag: v1.5.1
  pullPolicy: IfNotPresent

path: /synapse-admin

config: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

route:
  enabled: false
  host: ""
  gateway:
    name: moscow-gateway
    namespace: envoy-gateway-system
    sectionName: ""
  listenerSet:
    enabled: false
    attachTo: ""
  tls:
    secretName: ""
    secretNamespace: ""
    certificate:
      enabled: false
      issuer: letsencrypt
    referenceGrant:
      enabled: true
      name: ""
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    secretName: ""

adminApi:
  enabled: false
  path: /_synapse/admin
  service:
    name: ""
    port: 8008

admin:
  username: ""
  password: ""
  synapseUrl: ""
  synapseConfigSecret: ""
  synapseConfigSecretKey: config.yaml
  image:
    repository: ghcr.io/element-hq/synapse
    tag: v1.163.1
    pullPolicy: IfNotPresent
